<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agri Smart Sri Lanka</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #eef7ee;
    margin: 0;
    padding: 15px;
}
header {
    background: #16823b;
    color: white;
    text-align: center;
    padding: 20px;
    border-radius: 12px;
}
h2 {
    color: #167239;
}
.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}
button {
    background: white;
    border: 2px solid #16823b;
    border-radius: 10px;
    padding: 15px 5px;
    font-size: 16px;
    cursor: pointer;
}
button:active {
    background: #b9e8bd;
}
#details {
    background: white;
    padding: 18px;
    margin-top: 20px;
    border-radius: 12px;
    min-height: 60px;
}
</style>
</head>

<body>

<header>
<h1>🌱 Agri Smart Sri Lanka</h1>
<p>ශ්‍රී ලංකාවේ ගොවි ජනතාව වෙනුවෙන්</p>
</header>

<h2>🥬 එළවළු වර්ග</h2>
<div class="grid" id="vegetables"></div>

<h2>🍎 පලතුරු වර්ග</h2>
<div class="grid" id="fruits"></div>

<div id="details">
<h3>🌾 කෘෂිකාර්මික තොරතුරු</h3>
<p>ඔබට අවශ්‍ය එළවළුවක් හෝ පලතුරක් තෝරන්න.</p>
</div>

<script>

const vegetables = [
"වම්බටු","මිරිස්","මාළු මිරිස්",
"තක්කාලි","බණ්ඩක්කා","වට්ටක්කා",
"කැරට්","බීට්","බෝංචි",
"ගෝවා","පිපිඤ්ඤා","කරවිල",
"පතෝල","වැටකොළු","මෑකරල්",
"රාබු","නෝකෝල්","ලීක්ස්",
"නිවිති","කංකුං"
];

const fruits = [
"අඹ","කෙසෙල්","පැපොල්",
"කොමඩු","පේර","දෙහි",
"අන්නාසි","දොඩම්","දෙළුම්",
"රඹුටන්","අලිගැටපේර","දිවුල්",
"අනෝදා","පැෂන්","මිදි",
"කාමරංකා","නෙල්ලි","ලොවි",
"ජම්බු","වෙරළු"
];

function loadItems(items, id) {
    const area = document.getElementById(id);

    items.forEach(item => {
        const btn = document.createElement("button");
        btn.textContent = item;
        btn.onclick = () => showDetails(item);
        area.appendChild(btn);
    });
}

function showDetails(name) {
    document.getElementById("details").innerHTML =
    "<h2>🌱 " + name + "</h2>" +
    "<p>වගා කිරීමේ විස්තර</p>" +
    "<p>සිටුවීමේ කාලය, බීජ ප්‍රමාණය, පොහොර යෙදීම, ජලය සැපයීම සහ අස්වනු නෙළීම පිළිබඳ තොරතුරු ඉදිරියේදී මෙහි ඇතුළත් කරනු ලැබේ.</p>";
}

loadItems(vegetables, "vegetables");
loadItems(fruits, "fruits");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agri Smart Sri Lanka</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f1f8e9;
    margin: 0;
    padding: 12px;
}

header {
    background: #167c36;
    color: white;
    padding: 22px 10px;
    text-align: center;
    border-radius: 12px;
}

h2 {
    color: #167c36;
}

.section {
    background: white;
    padding: 12px;
    margin-top: 15px;
    border-radius: 12px;
}

.crop {
    background: #e8f5e9;
    padding: 14px;
    margin: 8px 0;
    border-radius: 9px;
    cursor: pointer;
    font-size: 17px;
    border: 1px solid #c8e6c9;
}

.crop:active {
    background: #a5d6a7;
}

.info {
    display: none;
    background: #fffde7;
    padding: 15px;
    margin: 5px 0 12px;
    border-radius: 10px;
    border-left: 5px solid #388e3c;
    line-height: 1.8;
}

.info h3 {
    color: #167c36;
}

input {
    width: 95%;
    padding: 10px;
    margin: 8px 0;
}

button {
    background: #167c36;
    color: white;
    border: none;
    padding: 12px;
    border-radius: 8px;
}
</style>
</head>

<body>

<header>
<h1>🌱 Agri Smart Sri Lanka</h1>
<p>ශ්‍රී ලංකාවේ ගොවිතැනට අත්වැලක්</p>
</header>

<div class="section">
<h2>🥬 එළවළු වගාව</h2>
<div id="vegetables"></div>
</div>

<div class="section">
<h2>🍉 පලතුරු වගාව</h2>
<div id="fruits"></div>
</div>

<div class="section">
<h2>🔍 වගා රෝග හඳුනාගැනීම</h2>
<p>වගාවේ රෝග ලක්ෂණ සහිත ඡායාරූපයක් තෝරන්න.</p>
<input type="file" accept="image/*" onchange="showPhoto(event)">
<img id="preview" style="width:100%;display:none;border-radius:10px">
<p id="photoText"></p>
</div>

<script>

let vegetables = [
"වට්ටක්කා",
"තක්කාලි",
"බණ්ඩක්කා",
"වම්බටු",
"මාළු මිරිස්",
"අමු මිරිස්",
"කැරට්",
"බීට්",
"බෝංචි",
"ගෝවා",
"පිපිඤ්ඤා",
"කරවිල",
"පතෝල",
"වැටකොළු",
"මෑකරල්",
"රාබු",
"නෝකෝල්",
"ලීක්ස්",
"නිවිති",
"කංකුං"
];

let fruits = [
"කෙසෙල්",
"අඹ",
"පැපොල්",
"අන්නාසි",
"පේර",
"කොමඩු",
"දෙහි",
"දොඩම්",
"දෙළුම්",
"රඹුටන්",
"අලිගැටපේර",
"දිවුල්",
"අනෝදා",
"පැෂන්",
"මිදි",
"කාමරංකා",
"නෙල්ලි",
"ලොවි",
"කොස්",
"ඩ්‍රැගන් ෆෘට්"
];

function cropInfo(name) {

if(name === "වට්ටක්කා") {
return `
<h3>🎃 වට්ටක්කා වගාව</h3>
<p><b>දේශගුණය:</b> උණුසුම් දේශගුණය සුදුසුයි.</p>
<p><b>පස:</b> ජලය බැස යන සාරවත් පස. pH අගය 5.5 - 7.5.</p>
<p><b>බීජ:</b> හෙක්ටයාරයකට කිලෝ 1ක් පමණ.</p>
<p><b>පරතරය:</b> වර්ගය අනුව පැළ අතර සහ පේළි අතර පරතරය තීරණය කරන්න.</p>
<p><b>පොහොර:</b> පස් පරීක්ෂාව සහ කෘෂිකර්ම උපදෙස් අනුව යොදන්න.</p>
<p><b>ජලය:</b> පසෙහි තෙතමනය පවත්වා ගන්න.</p>
<p><b>රෝග:</b> පිටිපුස් රෝගය, කොළ රෝග සහ පළිබෝධ හානි ගැන සැලකිලිමත් වන්න.</p>
<p><b>අස්වැන්න:</b> වර්ගය අනුව වෙනස් වේ. හෙක්ටයාරයකට කිලෝ 15,000 - 20,000 පමණ ලබාගත හැකි අවස්ථා ඇත.</p>
`;
}

if(name === "තක්කාලි") {
return `
<h3>🍅 තක්කාලි වගාව</h3>
<p><b>දේශගුණය:</b> 21°C - 24°C පමණ උෂ්ණත්වය සුදුසුයි.</p>
<p><b>පස:</b> හොඳින් ජලය බැස යන පස. pH 5.5 - 7.5.</p>
<p><b>වගා කාලය:</b> ප්‍රදේශයේ දේශගුණය අනුව මාර්තු සහ අගෝස්තු අග කාලයන් සුදුසු විය හැකියි.</p>
<p><b>බීජ:</b> හෙක්ටයාරයකට ග්‍රෑම් 200 - 250 පමණ.</p>
<p><b>පරතරය:</b> වර්ගය අනුව පැළ අතර සහ පේළි අතර පරතරය තීරණය කරන්න.</p>
<p><b>පොහොර:</b> නිර්දේශිත පොහොර ක්‍රමය අනුගමනය කරන්න.</p>
<p><b>ජලය:</b> නිතර පසෙහි තෙතමනය පවත්වා ගන්න.</p>
<p><b>රෝග:</b> කොළ කොඩවීම, අංගමාරය සහ බැක්ටීරියා රෝග ගැන සැලකිලිමත් වන්න.</p>
<p><b>අස්වැන්න:</b> වර්ගය හා පාලන ක්‍රමය අනුව වෙනස් වේ.</p>
`;
}

return `
<h3>🌱 ${name} වගාව</h3>
<p><b>දේශගුණය:</b> ප්‍රදේශයට ගැළපෙන කාලගුණික තත්ත්ව තෝරාගන්න.</p>
<p><b>පස:</b> සාරවත්, හොඳින් ජලය බැස යන පසක් තෝරාගන්න.</p>
<p><b>බීජ:</b> සහතික කළ හොඳ තත්ත්වයේ බීජ භාවිත කරන්න.</p>
<p><b>වගා කිරීම:</b> නිර්දේශිත පරතරය අනුව වගා කරන්න.</p>
<p><b>පොහොර:</b> පස් පරීක්ෂාව සහ කෘෂිකර්ම උපදෙස් අනුව පොහොර යොදන්න.</p>
<p><b>ජලය:</b> වගාවට අවශ්‍ය පරිදි ජලය සපයන්න.</p>
<p><b>වල් පැළෑටි:</b> වගාව අවට වල් පැළෑටි ඉවත් කරන්න.</p>
<p><b>රෝග හා පළිබෝධ:</b> නිතර පරීක්ෂා කර අවශ්‍ය විට කෘෂිකර්ම උපදෙස් ලබාගන්න.</p>
<p><b>අස්වැන්න:</b> අස්වැන්න නෙළන කාලය වගා වර්ගය අනුව වෙනස් වේ.</p>
`;
}

function showItems(list, id) {

let container = document.getElementById(id);

list.forEach(name => {

let box = document.createElement("div");

box.innerHTML = `
<div class="crop" onclick="toggleInfo(this)">
🌱 ${name}
</div>
<div class="info">
${cropInfo(name)}
</div>
`;

container.appendChild(box);

});

}

function toggleInfo(element) {

let info = element.nextElementSibling;

let all = document.querySelectorAll(".info");

all.forEach(item => {
if(item !== info) {
item.style.display = "none";
}
});

if(info.style.display === "block") {
info.style.display = "none";
} else {
info.style.display = "block";
}

}

function showPhoto(event) {

let file = event.target.files[0];

if(file) {

let image = document.getElementById("preview");

image.src = URL.createObjectURL(file);
image.style.display = "block";

document.getElementById("photoText").innerText =
"ඡායාරූපය තෝරාගෙන ඇත. නිවැරදි රෝග හඳුනාගැනීම සඳහා කෘෂිකර්ම නිලධාරියෙකුගේ උපදෙස් ලබාගන්න.";

}

}

showItems(vegetables, "vegetables");
showItems(fruits, "fruits");

</script>

</body>
</html>

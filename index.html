<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agri Smart Sri Lanka</title>
<style>
body{font-family:Arial;background:#edf7ed;margin:0;padding:12px}
header{background:#16823b;color:white;text-align:center;padding:15px;border-radius:12px}
h2{color:#16823b}
.item{background:white;margin:10px 0;padding:14px;border-radius:10px;border:1px solid #16823b}
.name{font-size:18px;font-weight:bold;color:#176b32;cursor:pointer}
.info{display:none;padding:12px;background:#f0fff0;margin-top:10px;border-radius:8px;line-height:1.8}
</style>
</head>
<body>

<header>
<h2>🌱 Agri Smart Sri Lanka</h2>
<p>ගොවි ජනතාව වෙනුවෙන්</p>
</header>

<h2>🥬 එළවළු වර්ග</h2>
<div id="vegetables"></div>

<h2>🍎 පලතුරු වර්ග</h2>
<div id="fruits"></div>

<script>

const vegetables=[
"වට්ටක්කා","තක්කාලි","බණ්ඩක්කා","වම්බටු",
"මාළු මිරිස්","අමු මිරිස්","කැරට්","බීට්",
"බෝංචි","ගෝවා","පිපිඤ්ඤා","කරවිල",
"පතෝල","වැටකොළු","මෑකරල්","රාබු",
"නෝකෝල්","ලීක්ස්","නිවිති","කංකුං"
];

const fruits=[
"කෙසෙල්","අඹ","පැපොල්","අන්නාසි",
"පේර","කොමඩු","දෙහි","දොඩම්",
"දෙළුම්","රඹුටන්","අලිගැටපේර","දිවුල්",
"අනෝදා","පැෂන්","මිදි","කාමරංකා",
"නෙල්ලි","ලොවි","ජම්බු","වෙරළු"
];

function showItems(list,id){
let area=document.getElementById(id);

list.forEach(name=>{
let box=document.createElement("div");
box.className="item";

let title=document.createElement("div");
title.className="name";
title.innerText="🌱 "+name+" ▼";

let info=document.createElement("div");
info.className="info";
info.innerHTML=`
<h3>${name} වගා විස්තර</h3>
<p>🌱 සිටුවීමේ කාලය: ප්‍රදේශයේ කාලගුණය අනුව තෝරාගන්න.</p>
<p>🌾 බීජ ප්‍රමාණය: වර්ගය අනුව වෙනස් වේ.</p>
<p>🧪 පොහොර: පස පරීක්ෂා කර නිර්දේශ අනුව යොදන්න.</p>
<p>💧 ජලය: පසෙහි තෙතමනය අනුව සපයන්න.</p>
<p>🐛 රෝග පාලනය: වගාව නිතර පරීක්ෂා කරන්න.</p>
<p>📅 අස්වනු කාලය: බෝගයේ වර්ගය අනුව වෙනස් වේ.</p>
<p>💰 වෙළෙඳපොළ මිල: දිනපතා වෙනස් වේ.</p>
`;

title.onclick=()=>{
info.style.display=info.style.display==="block"?"none":"block";
title.innerText="🌱 "+name+(info.style.display==="block"?" ▲":" ▼");
};

box.appendChild(title);
box.appendChild(info);
area.appendChild(box);
});
}

showItems(vegetables,"vegetables");
showItems(fruits,"fruits");

</script>
</body>
</html>
